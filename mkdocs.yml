site_name: ALE Workshop
site_description: A step-by-step workshop for the mango4j crypto framework
repo_url: https://github.com/bitstep-ie/mango4j-crypto-workshop
repo_name: bitstep-ie/mango4j-crypto-workshop

theme:
  name: material
  logo: assets/mango-black.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - stages
        - talk
      check_paths: true
      dedent_subsections: true

plugins:
  - search

hooks:
  - hooks/snippet_links.py

extra:
  version:
    provider: mike

nav:
  - The Talk:
      - "What Is ALE, and Why?": talk/intro.md
      - "Key Aliases & Key Configs": talk/key-aliases.md
      - "Structured Ciphertext": talk/structured-ciphertext.md
      - "Transient vs. Encrypted Blobs": talk/transient-vs-encrypted-blobs.md
      - "Introducing HMACs": talk/introducing-hmacs.md
      - "Key Rotation": talk/key-rotation.md
      - "Single HMAC Strategy": talk/single-hmac.md
      - "List HMAC Strategy": talk/list-hmac.md
      - "Rekeying: Encryption": talk/rekeying-encryption.md
      - "Rekeying: HMACs": talk/rekeying-hmacs.md
      - "Security & Operational Considerations": talk/security-and-operational-considerations.md
  - The Workshop:
      - Introduction: stages/00-intro.md
      - "Getting Started": stages/01-getting-started.md
      - "Encrypting a Field": stages/02-encrypting-a-field.md
  - How This Workshop Works: how-it-works.md
  - FAQ:
      - ALE: talk/faq-ale.md
      - mango4j-crypto: talk/faq-mango4j.md
