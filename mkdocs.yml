site_name: Mango4j Crypto ALE Workshop
site_description: A step-by-step workshop for the mango4j crypto framework
repo_url: https://github.com/bitstep-ie/mango4j-crypto-workshop
repo_name: bitstep-ie/mango4j-crypto-workshop

theme:
  name: material
  logo: assets/mango-black.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - stages
      check_paths: true
      dedent_subsections: true

plugins:
  - search

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - The Talk:
      - "1. What Is ALE?": talk/01-what-is-ale.md
      - "2. Why Do We Need It?": talk/02-why-we-need-it.md
      - "3. The Naive Approach": talk/03-the-naive-approach.md
      - "4. Failure: Encrypted Columns": talk/04-failure-columns.md
      - "5. Failure: Single HMAC Column": talk/05-failure-single-hmac.md
      - "6. Failure: Key Rotation": talk/06-failure-key-rotation.md
      - "7. Failure: Locked-In Provider": talk/07-failure-locked-in.md
      - "8. Failure: Migration": talk/08-failure-migration.md
      - "9. Outages and Application Failure": talk/09-outages-and-failure.md
      - "10. Doing It Right": talk/10-doing-it-right.md
      - "11. Introducing mango4j-crypto": talk/11-introducing-mango4j-crypto.md
      - "12. What We're Building Today": talk/12-what-were-building-today.md
  - Workshop:
      - "1. Getting Started": stages/01-getting-started.md
      - "2. Encrypting a Field": stages/02-encrypting-a-field.md
  - How This Workshop Works: how-it-works.md
