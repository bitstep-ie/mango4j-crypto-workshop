site_name: ALE Workshop
site_description: A step-by-step workshop for the mango4j crypto framework
repo_url: https://github.com/bitstep-ie/mango4j-crypto-workshop
repo_name: bitstep-ie/mango4j-crypto-workshop

theme:
  name: material
  logo: assets/mango-black.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - stages
      check_paths: true
      dedent_subsections: true

plugins:
  - search

extra:
  version:
    provider: mike

nav:
  - The Talk:
      - "What Is ALE, and Why?": talk/01-intro.md
      - "Key Aliases & Key Configs": talk/02-key-aliases.md
      - "Structured Ciphertext": talk/03-structured-ciphertext.md
      - "Transient vs. Encrypted Blobs": talk/04-transient-vs-encrypted-blobs.md
      - "Key Rotation": talk/05-key-rotation.md
      - "Single HMAC Strategy": talk/06-single-hmac.md
      - "List HMAC Strategy": talk/07-list-hmac.md
      - "Rekeying: Encryption": talk/08-rekeying-encryption.md
      - "Rekeying: HMACs": talk/09-rekeying-hmacs.md
  - The Workshop:
      - Introduction: stages/00-intro.md
      - "Getting Started": stages/01-getting-started.md
      - "Encrypting a Field": stages/02-encrypting-a-field.md
  - How This Workshop Works: how-it-works.md
