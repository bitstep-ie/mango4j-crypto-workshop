site_name: Mango4j Crypto ALE Workshop
site_description: A step-by-step workshop for the mango4j crypto framework
repo_url: https://github.com/bitstep-ie/mango4j-crypto-workshop
repo_name: bitstep-ie/mango4j-crypto-workshop

theme:
  name: material
  logo: assets/mango-black.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - stages
      check_paths: true
      dedent_subsections: true

plugins:
  - search

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - The Talk:
      - "1. What Is ALE?": talk/01-what-is-ale.md
      - "2. Why Do We Need It?": talk/02-why-we-need-it.md
      - "3. A Simple Case of ALE": talk/03-the-naive-approach.md
      - "4. Failure: Encrypted Columns": talk/04-failure-columns.md
      - "5. Multiple Providers & Key Rotation": talk/05-multiple-providers-and-key-rotation.md
      - "6. HMAC Search & Key Rotation": talk/06-hmac-search-key-rotation.md
      - "7. HMAC for Uniqueness": talk/07-hmac-unique-constraints.md
      - "8. Single vs. List HMAC Strategy": talk/08-hmac-strategies-single-vs-list.md
      - "9. Rekeying Encrypted Data": talk/09-rekeying-encrypted-data.md
      - "10. Rekeying HMACs": talk/10-rekeying-hmacs.md
      - "11. Failure: Migration": talk/11-failure-migration.md
      - "12. Outages and Application Failure": talk/12-outages-and-failure.md
      - "13. Doing It Right": talk/13-doing-it-right.md
      - "14. Introducing mango4j-crypto": talk/14-introducing-mango4j-crypto.md
      - "15. What We're Building Today": talk/15-what-were-building-today.md
  - Workshop:
      - "1. Getting Started": stages/01-getting-started.md
      - "2. Encrypting a Field": stages/02-encrypting-a-field.md
  - How This Workshop Works: how-it-works.md
